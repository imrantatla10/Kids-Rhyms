<canvas id="c"></canvas>
<script>
// =====================================================================
//  Babar Azam vs Virat Kohli — animated stat comparison (1080×1080, silent)
//  All figures exactly as given in the user's script.
// =====================================================================
const S = 1080, DUR = 63.5;
const cv = document.getElementById('c'); cv.width = S; cv.height = S; const g = cv.getContext('2d');
const bg = new Image(); bg.src = '/src/bg.png';
const K = S / 1254;                          // image → canvas scale
const P = { x0: 300 * K + 8, x1: 950 * K - 8, y0: 205 * K, y1: 985 * K }; // centre panel (inner)
P.w = P.x1 - P.x0; P.h = P.y1 - P.y0; P.cx = (P.x0 + P.x1) / 2;
const GREEN = '#1fbf6a', GREEN2 = '#0b6b3a', BLUE = '#2f7bff', BLUE2 = '#123d9a', ORANGE = '#ff8a1f', GOLD = '#ffcf4a';
const UR = 'Inter, sans-serif', NUM = 'Inter, sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------------- timeline: one stat per step (English titles, digits only) ----------------
// [title, babar, kohli, kind, leader]  kind: 'date' | 'num' | 'year' | 'formats'
const STEPS = [
  ['BORN', '15 OCT 1994', '5 NOV 1988', 'date', null],
  ['INTERNATIONAL DEBUT', 2015, 2008, 'year', 'k'],
  ['ODI DEBUT', '31 MAY 2015', '18 AUG 2008', 'date', 'k'],
  ['T20I DEBUT', '7 SEP 2016', '12 JUN 2010', 'date', 'k'],
  ['TEST DEBUT', '13 OCT 2016', '20 JUN 2011', 'date', 'k'],
  ['WORLD CUP FINALS', 1, 4, 'num', 'k'],
  ['CAPTAINCY · MATCHES', 152, 213, 'num', 'k'],
  ['CAPTAINCY · WINS', 85, 135, 'num', 'k'],
  ['INTERNATIONAL RUNS', 16038, 28527, 'num', 'k'],
  ['CENTURIES', 32, 86, 'num', 'k'],
  ['FIFTIES', 111, 148, 'num', 'k'],
  ['CURRENTLY PLAYING', null, null, 'formats', null],
];
const T_INTRO = 4.4, STEP = 4.55, T_OUT = T_INTRO + STEPS.length * STEP; // 4.4 + 54.6 = 59.0 ; outro to 63.5
const SC = [{ id: 'intro', a: 0, b: T_INTRO }, ...STEPS.map((s, i) => ({ id: 'step', i, a: T_INTRO + i * STEP, b: T_INTRO + (i + 1) * STEP })), { id: 'outro', a: T_OUT, b: DUR }];

// ---------------- drawing helpers ----------------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(str, x, y, { size = 40, font = UR, color = '#fff', weight = 700, align = 'center', glow = null, blur = 18, stroke = null, sw = 6, dir = 'ltr', alpha = 1, maxW = null } = {}) {
  g.save(); g.globalAlpha *= alpha; g.direction = dir; g.textAlign = align; g.textBaseline = 'middle';
  let fs = size; g.font = `${weight} ${fs}px ${font}`; if (maxW) while (g.measureText(str).width > maxW && fs > 10) { fs -= 1; g.font = `${weight} ${fs}px ${font}`; }
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(str, x, y); }
  if (glow) { g.shadowColor = glow; g.shadowBlur = blur; } g.fillStyle = color; g.fillText(str, x, y); g.shadowBlur = 0; g.fillText(str, x, y); g.restore();
}
function card(x, y, w, h, side, k = 1, win = false, t = 0) { // side: 'b' (Babar) | 'k' (Kohli)
  g.save(); g.globalAlpha *= k;
  const c1 = side === 'b' ? GREEN : BLUE, c2 = side === 'b' ? GREEN2 : BLUE2;
  const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, c1 + 'ee'); gr.addColorStop(1, c2 + 'f2');
  if (win) { g.shadowColor = GOLD; g.shadowBlur = 22 + 10 * Math.sin(t * 6); }
  rr(x, y, w, h, 16); g.fillStyle = gr; g.fill(); g.shadowBlur = 0;
  g.lineWidth = win ? 3.5 : 2; g.strokeStyle = win ? GOLD : 'rgba(255,255,255,.35)'; g.stroke();
  // gloss
  const gl = g.createLinearGradient(x, y, x, y + h * .5); gl.addColorStop(0, 'rgba(255,255,255,.22)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); rr(x + 2, y + 2, w - 4, h * .45, 14); g.fillStyle = gl; g.fill();
  if (side === 'k') { g.fillStyle = ORANGE; rr(x + 10, y + h - 7, w - 20, 4, 2); g.fill(); }
  g.restore();
}
function badge(x, y, k, label = 'آگے') { if (k <= 0) return; g.save(); g.translate(x, y); g.scale(back(k), back(k)); rr(-46, -20, 92, 40, 20); g.fillStyle = GOLD; g.shadowColor = 'rgba(255,200,40,.8)'; g.shadowBlur = 16; g.fill(); g.shadowBlur = 0; text('▲ ' + label, 0, 1, { size: 24, color: '#2a1600' }); g.restore(); }
function trophy(x, y, s, k) { if (k <= 0) return; g.save(); g.translate(x, y); g.scale(s * back(k), s * back(k)); g.fillStyle = GOLD; g.shadowColor = 'rgba(255,200,40,.8)'; g.shadowBlur = 12;
  g.beginPath(); g.moveTo(-18, -26); g.lineTo(18, -26); g.quadraticCurveTo(18, 4, 0, 8); g.quadraticCurveTo(-18, 4, -18, -26); g.fill(); g.fillRect(-4, 6, 8, 12); rr(-14, 16, 28, 8, 3); g.fill();
  g.lineWidth = 4; g.strokeStyle = GOLD; g.beginPath(); g.arc(-18, -16, 8, Math.PI * .5, Math.PI * 1.5); g.stroke(); g.beginPath(); g.arc(18, -16, 8, -Math.PI * .5, Math.PI * .5); g.stroke(); g.restore(); }
function bar(x, y, w, h, frac, side, k) { // grows from centre outward: Babar to the left, Kohli to the right
  g.save(); g.globalAlpha *= k; rr(x, y, w, h, h / 2); g.fillStyle = 'rgba(255,255,255,.1)'; g.fill();
  const fw = w * clamp(frac); const gr = g.createLinearGradient(x, 0, x + w, 0);
  if (side === 'b') { gr.addColorStop(0, GREEN2); gr.addColorStop(1, GREEN); rr(x + w - fw, y, fw, h, h / 2); } else { gr.addColorStop(0, BLUE); gr.addColorStop(1, ORANGE); rr(x, y, fw, h, h / 2); }
  g.fillStyle = gr; g.fill(); g.restore(); }
function sideGlow(side, k, t) { if (k <= 0) return; g.save(); const x = side === 'b' ? 0 : S; const gr = g.createRadialGradient(x, S * .55, 10, x, S * .55, 520);
  const c = side === 'b' ? '40,220,120' : '60,130,255'; gr.addColorStop(0, `rgba(${c},${(.32 + .1 * Math.sin(t * 5)) * k})`); gr.addColorStop(1, `rgba(${c},0)`); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(0, 0, S, S); g.restore(); }
// two-column value row inside the panel. leader: 'b' | 'k' | null
function row(y, h, label, bv, kv, kIn, t, { leader = null, bSub = null, kSub = null, size = 46, nums = false } = {}) {
  const pad = 12, gap = 10, cw = (P.w - pad * 2 - gap) / 2, xb = P.x0 + pad, xk = xb + cw + gap; // Babar left, Kohli right (matches photo)
  const ky = (1 - easeOut(kIn)) * 26;
  if (label) text(label, P.cx, y - 30, { size: 28, color: GOLD, alpha: kIn, glow: 'rgba(0,0,0,.9)' });
  const kb = easeOut(ramp(kIn, 0, .7)), kk = easeOut(ramp(kIn, .25, 1));
  card(xb - (1 - kb) * 40, y + ky, cw, h, 'b', kb, leader === 'b', t); card(xk + (1 - kk) * 40, y + ky, cw, h, 'k', kk, leader === 'k', t);
  const fb = nums ? NUM : UR, yy = y + ky + (bSub ? h * .4 : h * .52);
  text(bv, xb + cw / 2 - (1 - kb) * 40, yy, { size, font: fb, alpha: kb, glow: 'rgba(0,0,0,.6)', maxW: cw - 18 });
  text(kv, xk + cw / 2 + (1 - kk) * 40, yy, { size, font: fb, alpha: kk, glow: 'rgba(0,0,0,.6)', maxW: cw - 18 });
  if (bSub) text(bSub, xb + cw / 2, y + ky + h * .78, { size: 26, alpha: kb * .95, color: '#d8ffe8' });
  if (kSub) text(kSub, xk + cw / 2, y + ky + h * .78, { size: 26, alpha: kk * .95, color: '#dbe7ff' });
  if (leader) badge(leader === 'b' ? xb + cw / 2 : xk + cw / 2, y + ky - 2, ramp(kIn, .9, 1.2));
  return { xb, xk, cw };
}
function header(title, k, sub = null) {
  const y = P.y0 + 52; g.save(); g.globalAlpha = easeOut(k);
  const w = P.w - 30; const x = P.cx - w / 2 + (1 - easeOut(k)) * 30;
  const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, 'rgba(255,207,74,0)'); gr.addColorStop(.5, 'rgba(255,207,74,.22)'); gr.addColorStop(1, 'rgba(255,207,74,0)');
  g.fillStyle = gr; g.fillRect(x, y - 34, w, 68); g.fillStyle = GOLD; g.fillRect(P.cx - 60 * easeOut(k), y + 36, 120 * easeOut(k), 3);
  text(title, P.cx, y, { size: 40, glow: 'rgba(255,190,40,.55)', blur: 20, maxW: P.w - 40 });
  if (sub) text(sub, P.cx, y + 66, { size: 26, color: '#c9d6ff', maxW: P.w - 40 });
  g.restore();
}
function colHeads(k, y = P.y0 + 122) { const pad = 12, gap = 10, cw = (P.w - pad * 2 - gap) / 2; const xb = P.x0 + pad + cw / 2, xk = P.x0 + pad + cw + gap + cw / 2;
  text('بابر اعظم', xb, y, { size: 27, color: '#7dffb6', alpha: k }); text('ویرات کوہلی', xk, y, { size: 27, color: '#8fb8ff', alpha: k }); }

// ---------------- scenes ----------------
function bigCard(x, y, w, h, side, k, win, t) { card(x, y, w, h, side, k, win, t); if (win && k > .9) arrow(x + w / 2, y - 4, ramp(k, .9, 1)); }
function arrow(x, y, k) { g.save(); g.translate(x, y); g.scale(back(k), back(k)); g.fillStyle = GOLD; g.shadowColor = 'rgba(255,200,40,.9)'; g.shadowBlur = 14; g.beginPath(); g.moveTo(0, -20); g.lineTo(18, 8); g.lineTo(-18, 8); g.closePath(); g.fill(); g.restore(); }
function title(str, k, y = P.y0 + 92) {
  const e = easeOut(k); g.save(); g.globalAlpha = e;
  const w = P.w - 24, x = P.cx - w / 2; const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, 'rgba(255,207,74,0)'); gr.addColorStop(.5, 'rgba(255,207,74,.24)'); gr.addColorStop(1, 'rgba(255,207,74,0)');
  g.fillStyle = gr; g.fillRect(x, y - 40, w, 80); g.fillStyle = GOLD; g.fillRect(P.cx - 80 * e, y + 44, 160 * e, 4); g.restore();
  g.save(); g.translate(P.cx, y); const sc = .85 + .15 * back(k); g.scale(sc, sc); text(str, 0, 0, { size: 52, weight: 900, alpha: e, glow: 'rgba(255,190,40,.6)', blur: 22, maxW: P.w - 50 }); g.restore();
}
function valueText(v, x, y, kind, c, a, side) {
  if (kind === 'date') { const parts = v.split(' '); text(parts[0] + ' ' + parts[1], x, y - 34, { size: 64, weight: 900, alpha: a, glow: 'rgba(0,0,0,.5)' }); text(parts[2], x, y + 44, { size: 54, weight: 800, alpha: a, color: side === 'b' ? '#d8ffe8' : '#dbe7ff' }); }
  else if (kind === 'year') text(String(Math.round(lerp(1990, v, c))), x, y, { size: 92, weight: 900, alpha: a, glow: 'rgba(0,0,0,.5)' });
  else text(fmt(v * c), x, y, { size: v > 9999 ? 66 : 104, weight: 900, alpha: a, glow: 'rgba(0,0,0,.5)', maxW: 220 });
}
function chip(x, y, label, on, k) { g.save(); g.globalAlpha *= k; rr(x - 70, y - 30, 140, 60, 30); g.fillStyle = on ? 'rgba(255,207,74,.95)' : 'rgba(255,255,255,.07)'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = on ? GOLD : 'rgba(255,255,255,.3)'; g.stroke();
  text(label, x, y + 1, { size: 32, weight: 900, color: on ? '#2a1600' : 'rgba(255,255,255,.4)' }); if (!on) { g.strokeStyle = 'rgba(255,70,50,.95)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x - 52, y - 18); g.lineTo(x + 52, y + 18); g.stroke(); } g.restore(); }
function scStep(t, sc) {
  const [ttl, bv, kv, kind, lead] = STEPS[sc.i], t0 = sc.a; title(ttl, ramp(t, t0, t0 + .6));
  const pad = 14, gap = 12, cw = (P.w - pad * 2 - gap) / 2, xb = P.x0 + pad, xk = xb + cw + gap, y = P.y0 + 200, h = 300;
  const kb = easeOut(ramp(t, t0 + .35, t0 + 1.0)), kk = easeOut(ramp(t, t0 + .6, t0 + 1.25)); const c = easeOut(ramp(t, t0 + .7, t0 + 2.3));
  const win = (s) => lead === s && t > t0 + 2.4;
  if (kind === 'formats') {
    bigCard(xb - (1 - kb) * 50, y, cw, 420, 'b', kb, false, t); bigCard(xk + (1 - kk) * 50, y, cw, 420, 'k', kk, false, t);
    ['TEST', 'ODI', 'T20'].forEach((f, i) => { const kc = ramp(t, t0 + 1.0 + i * .35, t0 + 1.5 + i * .35); chip(xb + cw / 2, y + 90 + i * 120, f, true, kc); chip(xk + cw / 2, y + 90 + i * 120, f, f === 'ODI', kc); });
    sideGlow('b', ramp(t, t0 + 2.4, t0 + 3) * .8, t); return;
  }
  bigCard(xb - (1 - kb) * 50, y, cw, h, 'b', kb, win('b'), t); bigCard(xk + (1 - kk) * 50, y, cw, h, 'k', kk, win('k'), t);
  valueText(bv, xb + cw / 2 - (1 - kb) * 50, y + h / 2, kind, c, kb, 'b'); valueText(kv, xk + cw / 2 + (1 - kk) * 50, y + h / 2, kind, c, kk, 'k');
  if (kind === 'num') { const mx = Math.max(bv, kv), kbar = ramp(t, t0 + .7, t0 + 1.1); bar(xb, y + h + 40, cw, 16, bv / mx * c, 'b', kbar); bar(xk, y + h + 40, cw, 16, kv / mx * c, 'k', kbar); }
  if (kind === 'date' || kind === 'year') { // timeline strip: older date sits further left
    const kl = ramp(t, t0 + 1.2, t0 + 1.8); g.save(); g.globalAlpha = kl; g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(xb, y + h + 46, xk + cw - xb, 3); g.restore();
  }
  if (lead) sideGlow(lead, ramp(t, t0 + 2.4, t0 + 3.0) * (1 - ramp(t, sc.b - .6, sc.b)) * .9, t);
}
function scIntro(t) {
  const a = ramp(t, .3, 1.0), b = ramp(t, .8, 1.4), c = ramp(t, 1.2, 1.9), d = ramp(t, 2.2, 2.9);
  g.save(); g.translate(P.cx, P.y0 + 170); const s1 = .7 + .3 * back(a); g.scale(s1, s1); text('BABAR AZAM', 0, 0, { size: 68, weight: 900, color: '#7dffb6', alpha: a, glow: 'rgba(30,220,110,.8)', blur: 30 }); g.restore();
  text('VS', P.cx, P.y0 + 275, { size: 64, weight: 900, color: GOLD, alpha: b, glow: 'rgba(255,190,40,.8)' });
  g.save(); g.translate(P.cx, P.y0 + 380); const s3 = .7 + .3 * back(c); g.scale(s3, s3); text('VIRAT KOHLI', 0, 0, { size: 68, weight: 900, color: '#9cc2ff', alpha: c, glow: 'rgba(50,120,255,.85)', blur: 30 }); g.restore();
  g.save(); g.globalAlpha = easeOut(d); rr(P.x0 + 30, P.y0 + 490, P.w - 60, 96, 18); g.fillStyle = 'rgba(200,20,20,.85)'; g.fill(); g.lineWidth = 3; g.strokeStyle = GOLD; g.stroke(); g.restore();
  text("WHO'S AHEAD?", P.cx, P.y0 + 538, { size: 54, weight: 900, alpha: d });
  sideGlow('b', a * (1 - ramp(t, 3.6, 4.3)), t); sideGlow('k', c * (1 - ramp(t, 3.6, 4.3)), t);
}
function scOutro(t, sc) {
  const t0 = sc.a; title('FINAL TALLY', ramp(t, t0, t0 + .6), P.y0 + 80);
  const rows = [['RUNS', 16038, 28527], ['100s', 32, 86], ['50s', 111, 148], ['WC FINALS', 1, 4]];
  const pad = 14, gap = 12, cw = (P.w - pad * 2 - gap) / 2, xb = P.x0 + pad, xk = xb + cw + gap;
  rows.forEach(([lab, b, k], i) => { const kr = easeOut(ramp(t, t0 + .4 + i * .3, t0 + 1.0 + i * .3)); const y = P.y0 + 170 + i * 118;
    g.save(); g.globalAlpha = kr; text(lab, P.cx, y, { size: 26, weight: 800, color: GOLD }); g.restore();
    card(xb, y + 20, cw, 76, 'b', kr, false, t); card(xk, y + 20, cw, 76, 'k', kr, true, t);
    text(fmt(b), xb + cw / 2, y + 58, { size: 46, weight: 900, alpha: kr }); text(fmt(k), xk + cw / 2, y + 58, { size: 46, weight: 900, alpha: kr }); });
}
const DRAW = { intro: (t, sc) => scIntro(t), step: scStep, outro: scOutro };

// ---------------- frame ----------------
function bgDraw(t) {
  const z = 1.0 + .035 * Math.sin(t * .18) + .02 * ramp(t, 0, 2); const w = S * z; g.drawImage(bg, (S - w) / 2, (S - w) / 2 - 4 * Math.sin(t * .3), w, w);
  // panel darkening so text pops (inside the gold frame)
  g.save(); rr(P.x0, P.y0, P.w, P.h, 14); const gr = g.createLinearGradient(0, P.y0, 0, P.y1); gr.addColorStop(0, 'rgba(4,10,30,.55)'); gr.addColorStop(1, 'rgba(4,10,30,.35)'); g.fillStyle = gr; g.fill(); g.restore();
}
function sparks(t) { g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 40; i++) { const s = (i * 97.13) % 1, x = (i * 37.7) % S, sp = 20 + (i % 7) * 9, y = S - ((t * sp + i * 113) % (S + 50)); const a = .15 + .25 * Math.sin(t * 3 + i); g.fillStyle = `rgba(255,${180 + (i % 5) * 15},90,${a})`; g.beginPath(); g.arc(x, y, 1 + (i % 3), 0, 7); g.fill(); } g.restore(); }
function nameplates(t) {
  const k = easeOut(ramp(t, .2, 1.0));
  for (const [side, name, sub] of [['b', 'بابر اعظم', 'پاکستان'], ['k', 'ویرات کوہلی', 'بھارت']]) {
    const w = 236, h = 86, x = side === 'b' ? 18 - (1 - k) * 260 : S - 18 - w + (1 - k) * 260, y = S - h - 22;
    g.save(); const gr = g.createLinearGradient(x, y, x + w, y); if (side === 'b') { gr.addColorStop(0, GREEN2); gr.addColorStop(1, GREEN); } else { gr.addColorStop(0, BLUE); gr.addColorStop(1, BLUE2); }
    rr(x, y, w, h, 14); g.fillStyle = gr; g.globalAlpha = .93; g.fill(); g.globalAlpha = 1; g.lineWidth = 2.5; g.strokeStyle = GOLD; g.stroke(); if (side === 'k') { g.fillStyle = ORANGE; g.fillRect(x + 12, y + h - 6, w - 24, 3); }
    g.restore(); text(name, x + w / 2, y + 34, { size: 34 }); text(sub, x + w / 2, y + 68, { size: 20, color: side === 'b' ? '#c9ffe0' : '#d6e4ff' });
  }
}
function narrative(t) {
  const L = LINES.find(([a, b]) => t >= a && t < b); if (!L) return; const [a, b, s] = L; const k = easeOut(ramp(t, a, a + .4)) * (1 - ramp(t, b - .3, b));
  const w = 500, x = S / 2 - w / 2, y = P.y1 + 22; g.save(); g.globalAlpha = k; rr(x, y, w, 80, 16); g.fillStyle = 'rgba(0,0,0,.62)'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(255,207,74,.7)'; g.stroke(); g.restore();
  text(s, S / 2, y + 42 + (1 - k) * 10, { size: 30, alpha: k, maxW: w - 30 });
}
function transition(t) { // light-sweep wipe + flash at each scene change
  for (const sc of SC) { const d = t - sc.a; if (sc.a > 0 && d > -.35 && d < .35) {
    const p = (d + .35) / .7; g.save(); g.beginPath(); rr(P.x0, P.y0, P.w, P.h, 14); g.clip();
    const x = lerp(P.x0 - 200, P.x1 + 200, p); const gr = g.createLinearGradient(x - 160, 0, x + 160, 0); gr.addColorStop(0, 'rgba(255,207,74,0)'); gr.addColorStop(.5, `rgba(255,230,160,${.55 * Math.sin(p * Math.PI)})`); gr.addColorStop(1, 'rgba(255,207,74,0)');
    g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(P.x0, P.y0, P.w, P.h); g.restore();
    g.save(); g.globalAlpha = .18 * Math.max(0, 1 - Math.abs(d) / .2); g.fillStyle = '#fff'; g.fillRect(0, 0, S, S); g.restore(); } }
