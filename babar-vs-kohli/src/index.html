<canvas id="c"></canvas>
<script>
// =====================================================================
//  Babar Azam vs Virat Kohli — animated stat comparison (1080×1080, silent)
//  All figures exactly as given in the user's script.
// =====================================================================
const S = 1080, DUR = 63.5;
const cv = document.getElementById('c'); cv.width = S; cv.height = S; const g = cv.getContext('2d');
const bg = new Image(); bg.src = '/src/bg.png';
const K = S / 1254;                          // image → canvas scale
const P = { x0: 300 * K + 8, x1: 950 * K - 8, y0: 205 * K, y1: 985 * K }; // centre panel (inner)
P.w = P.x1 - P.x0; P.h = P.y1 - P.y0; P.cx = (P.x0 + P.x1) / 2;
const GREEN = '#1fbf6a', GREEN2 = '#0b6b3a', BLUE = '#2f7bff', BLUE2 = '#123d9a', ORANGE = '#ff8a1f', GOLD = '#ffcf4a';
const UR = '"Nastaliq", "Naskh", serif', NUM = '"Naskh", "Inter", sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------------- timeline (seconds) ----------------
const SC = [
  { id: 'intro', a: 0.0, b: 5.6 },
  { id: 'names', a: 5.6, b: 11.0 },
  { id: 'born', a: 11.0, b: 18.0 },
  { id: 'start', a: 18.0, b: 23.0 },
  { id: 'debut', a: 23.0, b: 33.6 },
  { id: 'finals', a: 33.6, b: 39.0 },
  { id: 'capt', a: 39.0, b: 46.6 },
  { id: 'record', a: 46.6, b: 56.8 },
  { id: 'formats', a: 56.8, b: DUR },
];
// narrative line under the panel (script, step by step)
const LINES = [
  [0.3, 5.5, 'کرکٹ کی دنیا کے 2 بڑے نام'],
  [5.7, 11.0, 'لیکن اعداد و شمار کی جنگ میں کون آگے ہے؟'],
  [11.1, 18.0, 'سب سے پہلے پیدائش!'],
  [18.1, 23.0, 'کوہلی نے 2008 میں انٹرنیشنل کرکٹ میں قدم رکھا، بابر نے 2015 میں'],
  [23.1, 33.6, 'ڈیبیو کی تاریخیں'],
  [33.7, 39.0, 'ورلڈ کپ فائنلز کی بات کریں تو…'],
  [39.1, 46.6, 'کپتانی کا ریکارڈ'],
  [46.7, 56.8, 'اب اصل ریکارڈ!'],
  [56.9, 63.2, 'لیکن یاد رکھیے…'],
];

// ---------------- drawing helpers ----------------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(str, x, y, { size = 40, font = UR, color = '#fff', weight = 700, align = 'center', glow = null, blur = 18, stroke = null, sw = 6, dir = 'rtl', alpha = 1, maxW = null } = {}) {
  g.save(); g.globalAlpha *= alpha; g.direction = dir; g.textAlign = align; g.textBaseline = 'middle';
  let fs = size; g.font = `${weight} ${fs}px ${font}`; if (maxW) while (g.measureText(str).width > maxW && fs > 10) { fs -= 1; g.font = `${weight} ${fs}px ${font}`; }
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(str, x, y); }
  if (glow) { g.shadowColor = glow; g.shadowBlur = blur; } g.fillStyle = color; g.fillText(str, x, y); g.shadowBlur = 0; g.fillText(str, x, y); g.restore();
}
function card(x, y, w, h, side, k = 1, win = false, t = 0) { // side: 'b' (Babar) | 'k' (Kohli)
  g.save(); g.globalAlpha *= k;
  const c1 = side === 'b' ? GREEN : BLUE, c2 = side === 'b' ? GREEN2 : BLUE2;
  const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, c1 + 'ee'); gr.addColorStop(1, c2 + 'f2');
  if (win) { g.shadowColor = GOLD; g.shadowBlur = 22 + 10 * Math.sin(t * 6); }
  rr(x, y, w, h, 16); g.fillStyle = gr; g.fill(); g.shadowBlur = 0;
  g.lineWidth = win ? 3.5 : 2; g.strokeStyle = win ? GOLD : 'rgba(255,255,255,.35)'; g.stroke();
  // gloss
  const gl = g.createLinearGradient(x, y, x, y + h * .5); gl.addColorStop(0, 'rgba(255,255,255,.22)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); rr(x + 2, y + 2, w - 4, h * .45, 14); g.fillStyle = gl; g.fill();
  if (side === 'k') { g.fillStyle = ORANGE; rr(x + 10, y + h - 7, w - 20, 4, 2); g.fill(); }
  g.restore();
}
function badge(x, y, k, label = 'آگے') { if (k <= 0) return; g.save(); g.translate(x, y); g.scale(back(k), back(k)); rr(-46, -20, 92, 40, 20); g.fillStyle = GOLD; g.shadowColor = 'rgba(255,200,40,.8)'; g.shadowBlur = 16; g.fill(); g.shadowBlur = 0; text('▲ ' + label, 0, 1, { size: 24, color: '#2a1600' }); g.restore(); }
function trophy(x, y, s, k) { if (k <= 0) return; g.save(); g.translate(x, y); g.scale(s * back(k), s * back(k)); g.fillStyle = GOLD; g.shadowColor = 'rgba(255,200,40,.8)'; g.shadowBlur = 12;
  g.beginPath(); g.moveTo(-18, -26); g.lineTo(18, -26); g.quadraticCurveTo(18, 4, 0, 8); g.quadraticCurveTo(-18, 4, -18, -26); g.fill(); g.fillRect(-4, 6, 8, 12); rr(-14, 16, 28, 8, 3); g.fill();
  g.lineWidth = 4; g.strokeStyle = GOLD; g.beginPath(); g.arc(-18, -16, 8, Math.PI * .5, Math.PI * 1.5); g.stroke(); g.beginPath(); g.arc(18, -16, 8, -Math.PI * .5, Math.PI * .5); g.stroke(); g.restore(); }
function bar(x, y, w, h, frac, side, k) { // grows from centre outward: Babar to the left, Kohli to the right
  g.save(); g.globalAlpha *= k; rr(x, y, w, h, h / 2); g.fillStyle = 'rgba(255,255,255,.1)'; g.fill();
  const fw = w * clamp(frac); const gr = g.createLinearGradient(x, 0, x + w, 0);
  if (side === 'b') { gr.addColorStop(0, GREEN2); gr.addColorStop(1, GREEN); rr(x + w - fw, y, fw, h, h / 2); } else { gr.addColorStop(0, BLUE); gr.addColorStop(1, ORANGE); rr(x, y, fw, h, h / 2); }
  g.fillStyle = gr; g.fill(); g.restore(); }
function sideGlow(side, k, t) { if (k <= 0) return; g.save(); const x = side === 'b' ? 0 : S; const gr = g.createRadialGradient(x, S * .55, 10, x, S * .55, 520);
  const c = side === 'b' ? '40,220,120' : '60,130,255'; gr.addColorStop(0, `rgba(${c},${(.32 + .1 * Math.sin(t * 5)) * k})`); gr.addColorStop(1, `rgba(${c},0)`); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(0, 0, S, S); g.restore(); }
// two-column value row inside the panel. leader: 'b' | 'k' | null
function row(y, h, label, bv, kv, kIn, t, { leader = null, bSub = null, kSub = null, size = 46, nums = false } = {}) {
  const pad = 12, gap = 10, cw = (P.w - pad * 2 - gap) / 2, xb = P.x0 + pad, xk = xb + cw + gap; // Babar left, Kohli right (matches photo)
  const ky = (1 - easeOut(kIn)) * 26;
  if (label) text(label, P.cx, y - 30, { size: 28, color: GOLD, alpha: kIn, glow: 'rgba(0,0,0,.9)' });
  const kb = easeOut(ramp(kIn, 0, .7)), kk = easeOut(ramp(kIn, .25, 1));
  card(xb - (1 - kb) * 40, y + ky, cw, h, 'b', kb, leader === 'b', t); card(xk + (1 - kk) * 40, y + ky, cw, h, 'k', kk, leader === 'k', t);
  const fb = nums ? NUM : UR, yy = y + ky + (bSub ? h * .4 : h * .52);
  text(bv, xb + cw / 2 - (1 - kb) * 40, yy, { size, font: fb, alpha: kb, glow: 'rgba(0,0,0,.6)', maxW: cw - 18 });
  text(kv, xk + cw / 2 + (1 - kk) * 40, yy, { size, font: fb, alpha: kk, glow: 'rgba(0,0,0,.6)', maxW: cw - 18 });
  if (bSub) text(bSub, xb + cw / 2, y + ky + h * .78, { size: 26, alpha: kb * .95, color: '#d8ffe8' });
  if (kSub) text(kSub, xk + cw / 2, y + ky + h * .78, { size: 26, alpha: kk * .95, color: '#dbe7ff' });
  if (leader) badge(leader === 'b' ? xb + cw / 2 : xk + cw / 2, y + ky - 2, ramp(kIn, .9, 1.2));
  return { xb, xk, cw };
}
function header(title, k, sub = null) {
  const y = P.y0 + 52; g.save(); g.globalAlpha = easeOut(k);
  const w = P.w - 30; const x = P.cx - w / 2 + (1 - easeOut(k)) * 30;
  const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, 'rgba(255,207,74,0)'); gr.addColorStop(.5, 'rgba(255,207,74,.22)'); gr.addColorStop(1, 'rgba(255,207,74,0)');
  g.fillStyle = gr; g.fillRect(x, y - 34, w, 68); g.fillStyle = GOLD; g.fillRect(P.cx - 60 * easeOut(k), y + 36, 120 * easeOut(k), 3);
  text(title, P.cx, y, { size: 40, glow: 'rgba(255,190,40,.55)', blur: 20, maxW: P.w - 40 });
  if (sub) text(sub, P.cx, y + 66, { size: 26, color: '#c9d6ff', maxW: P.w - 40 });
  g.restore();
}
function colHeads(k, y = P.y0 + 122) { const pad = 12, gap = 10, cw = (P.w - pad * 2 - gap) / 2; const xb = P.x0 + pad + cw / 2, xk = P.x0 + pad + cw + gap + cw / 2;
  text('بابر اعظم', xb, y, { size: 27, color: '#7dffb6', alpha: k }); text('ویرات کوہلی', xk, y, { size: 27, color: '#8fb8ff', alpha: k }); }

// ---------------- scenes ----------------
function scIntro(t, u, k) {
  const a = ramp(t, .3, 1.0), b = ramp(t, .8, 1.5), c = ramp(t, 1.3, 2.0), d = ramp(t, 2.4, 3.2);
  g.save(); const s1 = .7 + .3 * back(a); g.translate(P.cx, P.y0 + 170); g.scale(s1, s1); text('بابر اعظم', 0, 0, { size: 78, color: '#7dffb6', alpha: a, glow: 'rgba(30,220,110,.8)', blur: 30 }); g.restore();
  text('بمقابلہ', P.cx, P.y0 + 290, { size: 46, color: GOLD, alpha: b, glow: 'rgba(255,190,40,.7)' });
  g.save(); const s3 = .7 + .3 * back(c); g.translate(P.cx, P.y0 + 410); g.scale(s3, s3); text('ویرات کوہلی', 0, 0, { size: 74, color: '#9cc2ff', alpha: c, glow: 'rgba(50,120,255,.85)', blur: 30 }); g.restore();
  g.save(); g.globalAlpha = easeOut(d); rr(P.x0 + 30, P.y0 + 515, P.w - 60, 100, 18); g.fillStyle = 'rgba(200,20,20,.85)'; g.fill(); g.lineWidth = 3; g.strokeStyle = GOLD; g.stroke(); g.restore();
  text('کون کس سے آگے؟', P.cx, P.y0 + 565, { size: 52, alpha: d, glow: 'rgba(0,0,0,.6)' });
  sideGlow('b', a * (1 - ramp(t, 4.6, 5.4)), t); sideGlow('k', c * (1 - ramp(t, 4.6, 5.4)), t);
}
function scNames(t, u, k) {
  const t0 = SC[1].a; header('کرکٹ کے 2 بڑے نام', k);
  const r = row(P.y0 + 170, 120, null, 'پاکستان', 'بھارت', ramp(t, t0 + .5, t0 + 1.4), t, { size: 52, bSub: 'بابر اعظم', kSub: 'ویرات کوہلی' });
  const q = ramp(t, t0 + 2.2, t0 + 3.0);
  g.save(); g.globalAlpha = easeOut(q); g.translate(P.cx, P.y0 + 470); g.scale(.8 + .2 * back(q), .8 + .2 * back(q));
  text('اعداد و شمار کی جنگ', 0, -30, { size: 46, color: GOLD, glow: 'rgba(255,190,40,.6)' }); text('میں کون آگے ہے؟', 0, 50, { size: 50 }); g.restore();
  // big digits teaser: total runs flashing
  const z = ramp(t, t0 + 3.6, t0 + 4.4); text('⚔', P.cx, P.y0 + 600, { size: 54, font: NUM, alpha: z, color: '#fff', glow: 'rgba(255,255,255,.6)' });
}
function scBorn(t, u, k) {
  const t0 = SC[2].a; header('پیدائش', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  row(P.y0 + 230, 130, 'تاریخِ پیدائش', '15 اکتوبر 1994', '5 نومبر 1988', ramp(t, t0 + .6, t0 + 1.6), t, { size: 38 });
  row(P.y0 + 445, 110, 'شہر', 'لاہور', 'دہلی', ramp(t, t0 + 2.4, t0 + 3.4), t, { size: 52 });
  sideGlow('b', ramp(t, t0 + .6, t0 + 1.2) * (1 - ramp(t, t0 + 6.4, t0 + 7)) * .6, t); sideGlow('k', ramp(t, t0 + 1.0, t0 + 1.6) * (1 - ramp(t, t0 + 6.4, t0 + 7)) * .6, t);
}
function scStart(t, u, k) {
  const t0 = SC[3].a; header('انٹرنیشنل کرکٹ کا آغاز', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const c = easeOut(ramp(t, t0 + .8, t0 + 2.4));
  const r = row(P.y0 + 235, 170, 'پہلا سال', String(Math.round(lerp(1990, 2015, c))), String(Math.round(lerp(1990, 2008, c))), ramp(t, t0 + .6, t0 + 1.5), t, { size: 82, nums: true, leader: t > t0 + 2.6 ? 'k' : null });
  text('کوہلی 7 سال پہلے آئے', P.cx, P.y0 + 520, { size: 38, color: '#ffe9a8', alpha: ramp(t, t0 + 2.8, t0 + 3.4), glow: 'rgba(0,0,0,.8)' });
  sideGlow('k', ramp(t, t0 + 2.6, t0 + 3.2) * (1 - ramp(t, t0 + 4.4, t0 + 5)), t);
}
function scDebut(t, u, k) {
  const t0 = SC[4].a; header('ڈیبیو کی تاریخیں', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const rows = [['ODI ڈیبیو', '31 مئی 2015', '18 اگست 2008'], ['T20 ڈیبیو', '7 ستمبر 2016', '12 جون 2010'], ['Test ڈیبیو', '13 اکتوبر 2016', '20 جون 2011']];
  rows.forEach(([lab, b, kk], i) => row(P.y0 + 228 + i * 158, 96, lab, b, kk, ramp(t, t0 + .7 + i * 2.6, t0 + 1.7 + i * 2.6), t, { size: 36 }));
}
function scFinals(t, u, k) {
  const t0 = SC[5].a; header('ورلڈ کپ فائنلز', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const c = ramp(t, t0 + .9, t0 + 2.2); const r = row(P.y0 + 235, 170, 'کھیلے گئے فائنلز', String(Math.round(1 * easeOut(c))), String(Math.round(4 * easeOut(c))), ramp(t, t0 + .6, t0 + 1.4), t, { size: 96, nums: true, leader: t > t0 + 2.4 ? 'k' : null });
  for (let i = 0; i < 1; i++) trophy(r.xb + r.cw / 2, P.y0 + 490, 1.1, ramp(t, t0 + 1.2, t0 + 1.6));
  for (let i = 0; i < 4; i++) trophy(r.xk + r.cw / 2 + (i - 1.5) * 52, P.y0 + 490, 1.0, ramp(t, t0 + 1.2 + i * .25, t0 + 1.6 + i * .25));
  sideGlow('k', ramp(t, t0 + 2.4, t0 + 3) * (1 - ramp(t, t0 + 4.6, t0 + 5.3)), t);
}
function scCapt(t, u, k) {
  const t0 = SC[6].a; header('کپتانی', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const c1 = easeOut(ramp(t, t0 + 1.0, t0 + 2.6)), c2 = easeOut(ramp(t, t0 + 3.2, t0 + 4.8));
  const r = row(P.y0 + 230, 120, 'انٹرنیشنل میچز', fmt(152 * c1), fmt(213 * c1), ramp(t, t0 + .7, t0 + 1.5), t, { size: 66, nums: true, leader: t > t0 + 2.7 ? 'k' : null });
  row(P.y0 + 425, 120, 'فتوحات', fmt(85 * c2), fmt(135 * c2), ramp(t, t0 + 2.9, t0 + 3.7), t, { size: 66, nums: true, leader: t > t0 + 4.9 ? 'k' : null });
  const kb = ramp(t, t0 + 3.2, t0 + 3.8); bar(r.xb, P.y0 + 565, r.cw, 14, 85 / 135 * c2, 'b', kb); bar(r.xk, P.y0 + 565, r.cw, 14, 1 * c2, 'k', kb);
  sideGlow('k', ramp(t, t0 + 4.9, t0 + 5.5) * (1 - ramp(t, t0 + 6.8, t0 + 7.5)), t);
}
function scRecord(t, u, k) {
  const t0 = SC[7].a; header('اب اصل ریکارڈ!', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const items = [['انٹرنیشنل رنز', 16038, 28527], ['سنچریاں', 32, 86], ['ففٹیز', 111, 148]];
  items.forEach(([lab, b, kk], i) => { const s = t0 + .8 + i * 2.7, c = easeOut(ramp(t, s + .3, s + 2.0)); const y = P.y0 + 222 + i * 158;
    const r = row(y, 96, lab, fmt(b * c), fmt(kk * c), ramp(t, s, s + .9), t, { size: 60, nums: true, leader: t > s + 2.1 ? 'k' : null });
    const kb = ramp(t, s + .3, s + .8); bar(r.xb, y + 106, r.cw, 9, b / kk * c, 'b', kb); bar(r.xk, y + 106, r.cw, 9, 1 * c, 'k', kb); });
  sideGlow('k', ramp(t, t0 + 8.6, t0 + 9.2) * (1 - ramp(t, t0 + 9.6, t0 + 10.2)) * .8, t);
}
function chip(x, y, label, on, k) { g.save(); g.globalAlpha *= k; rr(x - 52, y - 24, 104, 48, 24); g.fillStyle = on ? 'rgba(255,207,74,.95)' : 'rgba(255,255,255,.08)'; g.fill(); g.lineWidth = 2; g.strokeStyle = on ? GOLD : 'rgba(255,255,255,.3)'; g.stroke();
  text(label, x, y + 1, { size: 26, font: NUM, dir: 'ltr', color: on ? '#2a1600' : 'rgba(255,255,255,.45)' }); if (!on) { g.strokeStyle = 'rgba(255,80,60,.9)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 40, y - 14); g.lineTo(x + 40, y + 14); g.stroke(); } g.restore(); }
function scFormats(t, u, k) {
  const t0 = SC[8].a; header('لیکن یاد رکھیے…', k); colHeads(ramp(t, t0 + .3, t0 + .8));
  const r = row(P.y0 + 230, 130, 'ابھی کون سی کرکٹ؟', 'تینوں فارمیٹس', 'صرف ODI', ramp(t, t0 + .7, t0 + 1.6), t, { size: 42 });
  const kc = ramp(t, t0 + 1.8, t0 + 2.4); const yy = P.y0 + 440;
  ['Test', 'ODI', 'T20'].forEach((f, i) => { chip(r.xb + r.cw / 2, yy + i * 62, f, true, ramp(t, t0 + 1.8 + i * .2, t0 + 2.2 + i * .2)); chip(r.xk + r.cw / 2, yy + i * 62, f, f === 'ODI', ramp(t, t0 + 1.8 + i * .2, t0 + 2.2 + i * .2)); });
  const e = ramp(t, t0 + 3.6, t0 + 4.3);
  sideGlow('b', ramp(t, t0 + 1.8, t0 + 2.6) * .8, t);
}
const DRAW = { intro: scIntro, names: scNames, born: scBorn, start: scStart, debut: scDebut, finals: scFinals, capt: scCapt, record: scRecord, formats: scFormats };

// ---------------- frame ----------------
function bgDraw(t) {
  const z = 1.0 + .035 * Math.sin(t * .18) + .02 * ramp(t, 0, 2); const w = S * z; g.drawImage(bg, (S - w) / 2, (S - w) / 2 - 4 * Math.sin(t * .3), w, w);
  // panel darkening so text pops (inside the gold frame)
  g.save(); rr(P.x0, P.y0, P.w, P.h, 14); const gr = g.createLinearGradient(0, P.y0, 0, P.y1); gr.addColorStop(0, 'rgba(4,10,30,.55)'); gr.addColorStop(1, 'rgba(4,10,30,.35)'); g.fillStyle = gr; g.fill(); g.restore();
}
function sparks(t) { g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 40; i++) { const s = (i * 97.13) % 1, x = (i * 37.7) % S, sp = 20 + (i % 7) * 9, y = S - ((t * sp + i * 113) % (S + 50)); const a = .15 + .25 * Math.sin(t * 3 + i); g.fillStyle = `rgba(255,${180 + (i % 5) * 15},90,${a})`; g.beginPath(); g.arc(x, y, 1 + (i % 3), 0, 7); g.fill(); } g.restore(); }
function nameplates(t) {
